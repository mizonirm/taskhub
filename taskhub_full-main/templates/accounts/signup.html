{% extends "base.html" %}{% block title %}Sign up · TaskHub{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <h2>Sign up</h2>
  <form method="post" class="tf-form">{% csrf_token %}{% include "_form.html" %}
    <button class="btn btn-primary" type="submit">Sign up</button></form>
  <p class="mt-3">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div></div>
{% endblock %}
