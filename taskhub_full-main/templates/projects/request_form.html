{% extends "base.html" %}{% block title %}New project request · TaskHub{% endblock %}
{% block content %}
<h2>New Project Request</h2>
<p class="text-muted">Your faculty advisor will be notified and can approve or deny the request.</p>
<form method="post" class="tf-form col-md-7">{% csrf_token %}{% include "_form.html" %}
  <button class="btn btn-primary" type="submit">Submit for approval</button>
  <a href="{% url 'dashboard' %}" class="btn btn-link">Cancel</a></form>
{% endblock %}
